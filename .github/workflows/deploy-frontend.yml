name: Deploy frontend a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'inventario-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventario-frontend
    env:
      VITE_BASE: /${{ github.event.repository.name }}/
      VITE_SUPABASE_URL: https://zlcjzgpcswigxulsplpp.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsY2p6Z3Bjc3dpZ3h1bHNwbHBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNjYyNzgsImV4cCI6MjEwNjc0MjI3OH0.recsv95eKafzOWxBGwi-hN2aXGDRkaJlKvOo5z_B03E
      # URL publica del backend en Railway
      VITE_API_URL: https://productos-production-8443.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inventario-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: inventario-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
