<nz-modal
  [(nzVisible)]="isVisible"
  [nzTitle]="isEditMode ? 'Editar Estructura Comercial' : 'Nuevo Estructura Comercial'"
  (nzOnCancel)="handleCancel()"
  (nzOnOk)="handleOk()"
  [nzOkText]="'Guardar'"
  [nzOkDisabled]="!structureForm.valid">
    <ng-container *nzModalContent>
      <form [formGroup]="structureForm" class="container-form">
        <div class="form-group">
            <label>POC Nombre</label>
            <nz-select nzShowSearch nzAllowClear formControlName="poc" nz-input [ngClass]="{'invalid-input': structureForm.get('poc')?.invalid && structureForm.get('poc')?.touched}">
              <nz-option *ngFor="let option of listPocForSelect" [nzLabel]="option.poc_nombre" [nzValue]="option.poc"></nz-option>
            </nz-select>
            <div *ngIf="structureForm.get('poc')?.invalid && structureForm.get('poc')?.touched" class="error-message">POC es requerido</div>
        </div>
        <div class="form-group">
            <label>POC Cadena</label>
            <input formControlName="poc_cadena" nz-input [ngClass]="{'invalid-input': structureForm.get('poc_cadena')?.invalid && structureForm.get('poc_cadena')?.touched}" />
            <div *ngIf="structureForm.get('poc_cadena')?.invalid && structureForm.get('poc_cadena')?.touched" class="error-message">POC Cadena es requerido</div>
        </div>
        <div class="form-group">
            <label>POC Backus</label>
            <input formControlName="poc_backus" nz-input [ngClass]="{'invalid-input': structureForm.get('poc_backus')?.invalid && structureForm.get('poc_backus')?.touched}" />
            <div *ngIf="structureForm.get('poc_backus')?.invalid && structureForm.get('poc_backus')?.touched" class="error-message">POC Backus es requerido</div>
        </div>
        <div class="form-group">
          <label>POC Nombre Planning</label>
          <input formControlName="poc_nombre_planning" nz-input [ngClass]="{'invalid-input': structureForm.get('poc_nombre_planning')?.invalid && structureForm.get('poc_nombre_planning')?.touched}" />
          <div *ngIf="structureForm.get('poc_nombre_planning')?.invalid && structureForm.get('poc_nombre_planning')?.touched" class="error-message">POC Nombre Planning es requerido</div>
        </div>
        <div class="form-group">
          <label>POC Tipo</label>
          <input formControlName="poc_tipo" nz-input [ngClass]="{'invalid-input': structureForm.get('poc_tipo')?.invalid && structureForm.get('poc_tipo')?.touched}" />
          <div *ngIf="structureForm.get('poc_tipo')?.invalid && structureForm.get('poc_tipo')?.touched" class="error-message">POC Tipo es requerido</div>
        </div>
        <div class="form-group">
          <label>Documento SV</label>
          <input formControlName="documento_sv" nz-input [ngClass]="{'invalid-input': structureForm.get('documento_sv')?.invalid && structureForm.get('documento_sv')?.touched}" />
          <div *ngIf="structureForm.get('documento_sv')?.invalid && structureForm.get('documento_sv')?.touched" class="error-message">Documento SV es requerido</div>
        </div>
        <div class="form-group">
          <label>Nombre SV</label>
          <input formControlName="nombre_sv" nz-input [ngClass]="{'invalid-input': structureForm.get('nombre_sv')?.invalid && structureForm.get('nombre_sv')?.touched}" />
          <div *ngIf="structureForm.get('nombre_sv')?.invalid && structureForm.get('nombre_sv')?.touched" class="error-message">Nombre SV es requerido</div>
        </div>
        <div class="form-group">
          <label>Documento BDR</label>
          <input formControlName="documento_bdr" nz-input [ngClass]="{'invalid-input': structureForm.get('documento_bdr')?.invalid && structureForm.get('documento_bdr')?.touched}" />
          <div *ngIf="structureForm.get('documento_bdr')?.invalid && structureForm.get('documento_bdr')?.touched" class="error-message">Documento BDR es requerido</div>
        </div>
        <div class="form-group">
          <label>Nombre BDR</label>
          <input formControlName="nombre_bdr" nz-input [ngClass]="{'invalid-input': structureForm.get('nombre_bdr')?.invalid && structureForm.get('nombre_bdr')?.touched}" />
          <div *ngIf="structureForm.get('nombre_bdr')?.invalid && structureForm.get('nombre_bdr')?.touched" class="error-message">Nombre BDR es requerido</div>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <nz-switch 
            formControlName="estado"
            (change)="onEstadoChange($event)">
          </nz-switch>
        </div>
        <div *ngIf="isEditMode" class="form-group">
          <label>Usuario ID Creación</label>
          <input formControlName="usuario_id_creacion" nz-input [disabled]="true"/>
        </div>
      </form>
    </ng-container>
  </nz-modal>
<!-- <app-spinner-loading [loading]="isLoading"></app-spinner-loading> -->
