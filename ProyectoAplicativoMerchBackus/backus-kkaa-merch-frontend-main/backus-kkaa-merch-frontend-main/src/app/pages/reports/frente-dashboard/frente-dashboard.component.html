<nz-layout class="layout">
  <nz-sider
    nzCollapsible
    [nzCollapsedWidth]="0"
    *ngIf="shouldAddBreakpoint(); else siderWithoutBreakpoint"
    nzBreakpoint="lg"
  >
    <app-filter-dashboard
      [filters]="filters"
      [tempFilters]="tempFilters"
      (filtersChanged)="handleFilterChange($event)"
    />
  </nz-sider>
  <ng-template #siderWithoutBreakpoint>
    <nz-sider nzCollapsible [nzCollapsedWidth]="0">
        <app-filter-dashboard
          [filters]="filters"
          [tempFilters]="tempFilters"
          (filtersChanged)="handleFilterChange($event)"
        />
    </nz-sider>
  </ng-template>
  <nz-layout>
    <nz-content>
      <div class="inner-content">
        <div class="container-content">
          <h2>Dashboard de Frentes</h2>
          <div class="chart-wrapper-line-marcas">
            <h4>Promedio por Marcas</h4>
            <div #frenteBrandsForStoreStackedLine class="chart-line-marcas"></div>
          </div>

          <div class="container-filter-marca-exhibition">
            <div class="item">
              <label>Marcas</label>
              <button nz-button nz-dropdown [nzDropdownMenu]="menuExhibitionMarca" [nzPlacement]="'bottomLeft'" style="width: 190px;">
                {{ selectComboBox.marca.titleSelect }}
                <span nz-icon nzType="down"></span>
              </button>
              <nz-dropdown-menu #menuExhibitionMarca="nzDropdownMenu">
                <ul nz-menu nzSelectable>
                  <li nz-menu-item class="button-clear-filter">
                    <button nz-button nzType="text" nzBlock (click)="removeFilterSelectedGraphic('marca')">
                      <span nz-icon nzType="filter" nzTheme="fill"></span>
                      Borrar Filtro
                    </button>
                  </li>
                  <li nz-menu-item>
                    <label nz-checkbox [(ngModel)]="selectComboBox.marca.selectAllChecked" (ngModelChange)="onSelectAllChangeGraphic($event, 'marca')">
                      Seleccionar todos
                    </label>
                  </li>
                  <li nz-menu-item *ngFor="let item of selectComboBox.marca.list">
                    <label nz-checkbox [(ngModel)]="item.checked" (ngModelChange)="onItemChangeGraphic('marca')">
                      {{ item.label }}
                    </label>
                  </li>
                </ul>
              </nz-dropdown-menu>
            </div>
