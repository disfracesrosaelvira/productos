<div class="container-collapse" style="padding-bottom: 4px;">
  <div *ngFor="let producto of productos">
    <nz-collapse [nzAccordion]="true" nzNoAnimation="true">
      <nz-collapse-panel [nzHeader]="headerTemplate" [nzActive]="producto.toggleActivado" nzExpandedIcon="double-right" >
        <!-- Contenido del panel de colapso -->
        <div class="container-collapse-panel" (click)="preventCollapse($event)">
          <div class="content-input">
            <label for="pvp-{{producto.id}}">* PVP Regular</label>
            <input nz-input id="pvp-{{producto.id}}" placeholder="Ingrese el precio" [(ngModel)]="producto.pvpRegular" type="number" (keypress)="validateNumberInput($event);" (input)="validatePvpRegular(producto);validateRecord()" (blur)="formatDecimal($event, producto, 'pvpRegular')"/>
          </div>
          <div class="container-group-inputs">
            <div class="content-input">
              <label for="mecanica-{{producto.id}}">Mecánica Promocional</label>
              <nz-select id="mecanica-{{producto.id}}" nzPlaceHolder="Seleccione" [(ngModel)]="producto.selectedMecanica" (ngModelChange)="validatePvpPromocional(producto);validateRecord()">
                <nz-option *ngFor="let option of mecanicaOptions" [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
              </nz-select>
            </div>
            <div *ngIf="validateSelectMecanica(producto)" class="content-input">
              <label for="pvp-promocional-{{producto.id}}">PVP Promocional</label>
              <input nz-input id="pvp-promocional-{{producto.id}}" placeholder="Ingrese el precio" [(ngModel)]="producto.pvpPromocional" type="number" (keypress)="validateNumberInput($event);" (input)="validatePvpPromocional(producto);validateRecord()" (blur)="formatDecimal($event, producto, 'pvpPromocional')"/>
              <div *ngIf="producto.inputErrors.promocional" class="error-message">Debe ser menor que el Regular</div>
            </div>
          </div>
          <div nz-row *ngIf="producto.selectedMecanica" class="content-input">
            <label for="pvp-adicional-{{producto.id}}">PVP Adicional (opcional)</label>
            <input nz-input id="pvp-adicional-{{producto.id}}" placeholder="Ingrese el precio" [(ngModel)]="producto.pvpAdicional" type="number" (keypress)="validateNumberInput($event)" (input)="validatePvpAdicional(producto); validateRecord()" (blur)="formatDecimal($event, producto, 'pvpAdicional')"/>
            <div *ngIf="producto.inputErrors.adicionalPromocional && producto.selectedMecanica != 'Sin Mecanica'" class="error-message">Debe ser menor que el Promocional</div>
            <div *ngIf="producto.inputErrors.adicionalRegular" class="error-message">Debe ser menor que el Regular</div>
          </div>
          <div class="content-input">
            <!-- <input type="file" id="foto-{{producto.id}}" accept="image/*" capture="camera" (change)="onFileChange($event, producto)" style="display: none;">
            <label for="foto-{{producto.id}}" class="custom-file-upload">
              <span nz-icon nzType="camera" nzTheme="outline"></span> Tomar foto
            </label> -->
            <!-- <button nz-button id="foto-{{producto.id}}" class="custom-file-upload" (click)="fileInput.click()">
              <i nz-icon nzType="camera" nzTheme="outline"></i> Tomar foto
              <input type="file" #fileInput style="display: none;" accept="image/*" capture="camera" (change)="onFileChange($event, producto)">
            </button> -->
            <label>* Foto</label>
            <div style="margin-bottom: 8px;">
              <input type="file" id="foto-{{producto.photoName}}" #fileInput accept="image/*" (change)="onFileChange($event, producto);" style="display: none;">
              <button nz-button nzBlock [disabled]="producto.file" class="custom-file-upload" (click)="fileInput.click();">
                <i nz-icon nzType="camera" nzTheme="outline"></i> Tomar foto
              </button>
              <div  style="color: red; text-align: center;">
                (Máximo 1)
            </div>
            </div>
            <div *ngIf="producto.photoName">
              <nz-collapse [nzBordered]="false">
                  <nz-collapse-panel
                    [nzHeader]="headerTemplateImagen"
                    nzHeader="This is panel header 1"
                    nzActive=false
                    nzExpandedIcon="double-right"                    
                  >
                    <div *ngIf="producto.imagenUrl">
                      <img [src]="producto.imagenUrl" alt="Imagen seleccionada" style="width: 100%; height: 350px;">
                    </div>
                    <ng-template #headerTemplateImagen>
                      <div class="container-header-photo">
                        <div style="display: flex; align-items: center;" [ngClass]="{ 'red': producto.offline }">
                          <span class="name-photo">{{ producto.photoName }}</span>
                          <span>.{{producto.photoExtension}}</span>
                        </div>
                        <div>
                          <button nz-button nzType="text" nzDanger (click)="clearImage(producto);validateRecord()">
                            <span nz-icon nzType="delete" nzTheme="fill"></span>
                          </button>
                        </div>
                      </div>
                    </ng-template>
                  </nz-collapse-panel>
              </nz-collapse>
            </div>
          </div>
        </div>
      </nz-collapse-panel>
      <ng-template #headerTemplate>
        <div class="collapse-custom-header" (click)="validateRecord()">
          <div class="collapse-header-content">
            <img [src]="producto.foto ? producto.foto : 'assets/img/picture.png'" class="header-icon" width="60px" height="40px"/>
            <span class="header-text">{{ producto.nombre }}</span>                                   
          </div>
          @if(producto.recordExists) {
            <span >✅</span>
          } @else if(producto.recordExists==false) {
            <span >❌</span>
          }
        </div>
        <!-- <div class="collapse-custom-header" (click)="preventCollapse($event)">
          <div class="collapse-header-content">
            <img [src]="producto.foto ? producto.foto : '../../../assets/img/picture.png'" class="header-icon" width="60px" height="40px"/>
            <span class="header-text">{{ producto.nombre }}</span>
          </div>
          <nz-switch nzSize="small" [ngModel]="producto.toggleActivado" (ngModelChange)="activateToggle(producto)"></nz-switch>
        </div> -->
      </ng-template>
    </nz-collapse>
  </div>
</div>

<div class="container-footer">
  <button nz-button nzType="primary" (click)="guardarProductos()" [disabled]="guardarHabilitado" style="border-radius: 8px;">Guardar</button>
</div>

<div class="fullscreen-overlay" *ngIf="loading">
  <div class="spinner-container">
    <nz-spin nzTip="Cargando..."></nz-spin>
  </div>
</div>
