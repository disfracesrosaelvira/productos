<div class="content-select-photo">
    <!-- <input type="file" #fileInput id="input-image" accept="image/*" [attr.capture]="useForPhotoCamera ? 'camera' : null" (change)="onFileChange($event)" style="display: none;">
    <button nz-button nzBlock [disabled]="uploadFileDisabled" nzSize="large" class="custom-file-upload" (click)="fileInput.click()">
        <i nz-icon nzType="camera" nzTheme="outline"></i> Tomar foto
    </button> -->
    <input type="file" #fileInput id="input-image" accept="image/*" (change)="onFileChange($event)" style="display: none;">
    <button nz-button nzBlock [disabled]="uploadFileDisabled" nzSize="large" class="custom-file-upload" (click)="fileInput.click()">
        <i nz-icon nzType="camera" nzTheme="outline"></i> Seleccionar imagen
    </button>
    <!-- Mensaje de error -->
    <div style="color: red; text-align: center;">
        (Máximo {{maxImages}})
    </div>
</div>
<div *ngIf="uploadFiles.length > 0">
    <nz-collapse [nzBordered]="false">
        <nz-collapse-panel *ngFor="let panel of uploadFiles; let i = index" [nzHeader]="headerTemplateImagen" [nzActive]="false" nzExpandedIcon="double-right">
            <!-- <img [src]="panel.viewImg" alt="Imagen seleccionada" class="photo-img"> -->
            <img [attr.src]="panel.isOffline ? panel.file : panel.viewImg" alt="Imagen seleccionada" class="photo-img">
            <ng-template #headerTemplateImagen>
                <div class="container-list-photo">
                <div style="display: flex; align-items: center;" [ngClass]="{ 'red': panel.isOffline }">
                    <span class="name-photo" [ngStyle]="{'max-width': maxWidth}" style="max-width: calc(100vw - 185px);">{{ panel.fotoName}}</span>
                    <span>.{{panel.fotoExtension}}</span>
                </div>
                <div>
                    <button nz-button nzType="text" nzDanger (click)="removeItemImg(i, panel)">
                        <!-- <span nz-icon nzType="delete" nzTheme="fill"></span> -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 1024 1024" style="width: 20px; height: 24px;">
                            <path style="fill: red;" d="M864 256H736v-80c0-35.3-28.7-64-64-64H352c-35.3 0-64 28.7-64 64v80H160c-17.7 0-32 14.3-32 32v32c0 4.4 3.6 8 8 8h60.4l24.7 523c1.6 34.1 29.8 61 63.9 61h454c34.2 0 62.3-26.8 63.9-61l24.7-523H888c4.4 0 8-3.6 8-8v-32c0-17.7-14.3-32-32-32zm-200 0H360v-72h304v72z"/>
                        </svg>
                    </button>
                </div>
                </div>
            </ng-template>
        </nz-collapse-panel>
    </nz-collapse>
</div>
  
<app-spinner-loading [loading]="loading"></app-spinner-loading>
